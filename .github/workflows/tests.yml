name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require private Runtime checkout token
        env:
          HERMES_CI_REPO_TOKEN: ${{ secrets.HERMES_CI_REPO_TOKEN }}
        run: |
          if [ -z "$HERMES_CI_REPO_TOKEN" ]; then
            echo "::error::HERMES_CI_REPO_TOKEN is required to checkout pipi-HST/hermes-agent-main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Checkout Runtime repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: pipi-HST/hermes-agent-main
          token: ${{ secrets.HERMES_CI_REPO_TOKEN }}
          path: runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare runtime config
        # Some bridge/agent tests need a config.yaml at the repo root; the
        # example config points at ~/Hermes/knowledge, which is writable here.
        run: cp config.example.yaml config.yaml

      - name: Check docs and generated state
        env:
          HERMES_RUNTIME_ROOT: ${{ github.workspace }}/runtime
        run: |
          python scripts/check_docs.py
          python -c "from db.schema import init_db; init_db('data/captures.db')"
          python scripts/update_current_state.py --check
          python scripts/architecture_inventory.py --check --strict

      - name: Run unit tests
        env:
          HERMES_API_TOKEN: ""
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_knowledge_pipeline_e2e.py \
            --ignore=tests/test_knowledge_product_e2e.py \
            --ignore=tests/test_knowledge_capture_acceptance_matrix.py \
            --ignore=tests/test_knowledge_pipeline_acceptance_matrix.py \
            --ignore=tests/test_reset_smoke.py \
            --ignore=tests/test_e2e_full_flow.py
