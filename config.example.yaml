# hermes-custom/config.example.yaml
# Copy to config.yaml and fill with local real values.
# config.yaml is sensitive local state and must not be committed or pasted into logs.

llm:
  provider: openai
  model: deepseek-v4-pro
  base_url: "https://api.deepseek.com"
  api_key: "REPLACE_WITH_LLM_API_KEY"

qwen:
  # Used for DashScope embeddings, OCR, and ASR paths.
  api_key: "REPLACE_WITH_QWEN_OR_DASHSCOPE_API_KEY"

feishu:
  app_id: "REPLACE_WITH_FEISHU_APP_ID"
  app_secret: "REPLACE_WITH_FEISHU_APP_SECRET"
  folder_token: "REPLACE_WITH_FEISHU_FOLDER_TOKEN"

wechat: {}

asr:
  provider: dashscope
  api_key: "REPLACE_WITH_ASR_API_KEY"

retrieval:
  # Optional override for MIN_VECTOR_SCORE; leave blank to use the code default.
  min_vector_score:

database:
  path: "./data/captures.db"

worker:
  # When false (default), PATCH /api/library/folders/{path} renames synchronously.
  # When true, the endpoint submits a rename_folder job and waits for the
  # knowledge write worker; start `python start_worker.py` first.
  enabled: false
  # How long the HTTP request waits for the worker before returning 503.
  rename_timeout_seconds: 30.0

vault:
  path: "~/Hermes/knowledge"
